version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gym_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gym_management
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # Ensure Prisma connects seamlessly
    command: --default-authentication-plugin=mysql_native_password

volumes:
  mysql_data:
